name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py
